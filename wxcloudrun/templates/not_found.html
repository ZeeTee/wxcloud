<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>没有这一天的日报</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 20px;
      color: #333;
      text-align: center;
      line-height: 1.8;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    p {
      font-size: 14px;
      color: #777;
      margin: 0 0 8px;
    }

    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <h1>没有找到这一天的日报</h1>

  {% if date %}
  <p><code>{{ date }}</code> 没有归档内容。</p>
  {% endif %}

  <p>请检查日期是否为 <code>YYYY-MM-DD</code> 格式,或该日报尚未上传。</p>
</body>

</html>
